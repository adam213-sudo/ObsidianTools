<html lang="en" dir="ltr" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Obsidian Tools - Trusted Tools & Software</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #121212;
            --bg-header: #181818;
            --bg-aside: #151515;
            --bg-card: #181818;
            --border-color: #282828;
            --border-card: #252525;
            --card-shadow: none;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --input-bg: #1a1a1a;
            --input-border: #2c2c2c;
            --footer-bg: #141414;
            --hover-item: #1f1f1f;
        }

        html.light {
            --bg-body: #f4f5f7;
            --bg-header: #ffffff;
            --bg-aside: #ffffff;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
            --border-card: #cbd5e1;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --footer-bg: #ffffff;
            --hover-item: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-header);
            border-bottom: 2px solid var(--border-color);
            direction: ltr;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }
        .logo span {
            color: #ff6600;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .lang-select, .theme-btn {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .theme-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            padding: 0;
        }
        .main-layout {
            display: flex;
            flex: 1;
            position: relative;
        }
        aside {
            width: 280px;
            background-color: var(--bg-aside);
            border-left: 2px solid var(--border-color);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        html[dir="ltr"] aside {
            border-left: none;
            border-right: 2px solid var(--border-color);
        }
        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-title {
            font-size: 13px;
            font-weight: 700;
            color: #ff6600;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 8px;
        }
        .menu-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: #ff6600;
            border-radius: 2px;
            opacity: 0.7;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: var(--hover-item);
            color: var(--text-main);
        }
        .menu-item.active {
            background-color: #ff6600;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }
        .content-area {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-section {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }
        .hero-section h1 {
            font-size: 32px;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 700;
        }
        .search-box {
            position: relative;
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 30px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }
        html[dir="rtl"] .search-box input {
            padding: 14px 45px 14px 20px;
        }
        html[dir="ltr"] .search-box input {
            padding: 14px 20px 14px 45px;
        }
        .search-box input:focus {
            border-color: #ff6600;
        }
        .search-box i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        html[dir="rtl"] .search-box i {
            right: 20px;
            left: auto;
        }
        html[dir="ltr"] .search-box i {
            left: 20px;
            right: auto;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .tool-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: var(--card-shadow);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, background-color 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .tool-card:hover {
            transform: translateY(-3px);
            border-color: #ff6600;
        }
        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .tool-rating {
            color: #f59e0b;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .tool-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .tool-body h3 {
            font-size: 17px;
            color: var(--text-main);
            margin-bottom: 0;
        }
        .tool-body p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .details-btn, .quick-dl-btn {
            background-color: transparent;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .quick-dl-btn {
            background-color: #ff6600;
            color: #fff;
        }
        .details-btn:hover {
            background-color: #ff6600;
            color: #fff;
        }
        .quick-dl-btn:hover {
            opacity: 0.9;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 2px solid var(--border-color);
            background-color: var(--footer-bg);
            transition: background-color 0.3s, border-color 0.3s;
        }
        footer a {
            color: #ff6600;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

        let currentLang = localStorage.getItem('obsidian_lang') || 'ar';
        let currentFilter = 'all';

        function initApp() {
            document.getElementById('langSelect').value = currentLang;
            applyLanguage(currentLang);
            renderTools();
        }

        function changeLanguageDropdown() {
            const select = document.getElementById('langSelect');
            currentLang = select.value;
            localStorage.setItem('obsidian_lang', currentLang);
            applyLanguage(currentLang);
            renderTools();
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations['ar'];
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', t.dir);
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('heroTitle').innerText = t.heroTitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            
            document.getElementById('menuTitleBrowse').innerText = t.menuBrowse;
            document.getElementById('menuHome').innerText = t.menuHome;
            document.getElementById('menuPopular').innerText = t.menuPopular;
            document.getElementById('menuRated').innerText = t.menuRated;
            document.getElementById('menuTitleCategories').innerText = t.menuCategories;
            document.getElementById('menuBrowsers').innerText = t.menuBrowsers;
            document.getElementById('menuMessaging').innerText = t.menuMessaging;
            document.getElementById('menuMedia').innerText = t.menuMedia;
            document.getElementById('menuCompression').innerText = t.menuCompression;
            document.getElementById('menuRuntimes').innerText = t.menuRuntimes;
            document.getElementById('menuDev').innerText = t.menuDev;
            document.getElementById('menuUtilities').innerText = t.menuUtilities;
            document.getElementById('menuSecurity').innerText = t.menuSecurity;
            document.getElementById('menuImaging').innerText = t.menuImaging;
            document.getElementById('footerText').innerHTML = t.footer;
            document.getElementById('reportLink').innerText = t.report;
        }

        function filterCategory(category, event) {
            if (event) event.preventDefault();
            currentFilter = category;
            
            document.querySelectorAll('aside .menu-item').forEach(item => item.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            renderTools();
        }

        function filterTools() {
            renderTools();
        }

        function renderTools() {
            const t = translations[currentLang] || translations['ar'];
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';

            let filtered = t.tools.filter(tool => {
                const matchesSearch = tool.name.toLowerCase().includes(searchQuery) || tool.desc.toLowerCase().includes(searchQuery);
                if (!matchesSearch) return false;

                if (currentFilter === 'all') return true;
                if (currentFilter === 'popular') return parseFloat(tool.rating) >= 4.9;
                if (currentFilter === 'rated') return parseFloat(tool.rating) >= 4.9;
                return tool.category === currentFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد نتائج مطابقة لبحثك.</p>`;
                return;
            }

            filtered.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div>
                        <div class="tool-header">
                            <div class="tool-rating">
                                <i class="fa-solid fa-star"></i>
                                <span>${tool.rating}</span>
                            </div>
                        </div>
                        <div class="tool-title-row">
                            <img src="${tool.icon}" alt="${tool.name}" class="tool-icon" onerror="this.src='logo.png'">
                            <h3 style="font-size: 16px; color: var(--text-main);">${tool.name}</h3>
                        </div>
                        <div class="tool-body">
                            <p>${tool.desc}</p>
                        </div>
                    </div>
                    <div class="tool-footer">
                        <span>${tool.size}</span>
                        <div class="card-actions">
                            <a href="tool-details.html?tool=${tool.id}&lang=${currentLang}" class="details-btn">${t.details}</a>
                            <a href="${tool.url}" class="quick-dl-btn" target="_blank" rel="noopener noreferrer" title="تحميل مباشر"><i class="fa-solid fa-download"></i></a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('obsidian_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('obsidian_theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('obsidian_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
            initApp();
        });
    </script>
