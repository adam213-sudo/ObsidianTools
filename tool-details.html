<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">

    <title id="pageTitle">Obsidian Tools - تفاصيل الأداة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #121212;
            --bg-header: #181818;
            --bg-card: #181818;
            --border-color: #282828;
            --border-card: #252525;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --input-bg: #1a1a1a;
            --input-border: #2c2c2c;
            --footer-bg: #141414;
        }

        html.light {
            --bg-body: #f4f5f7;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
            --border-card: #cbd5e1;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --footer-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-header);
            border-bottom: 2px solid var(--border-color);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }
        .logo span {
            color: #ff6600;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .home-btn, .lang-select {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
        }
        .home-btn:hover, .lang-select:hover {
            border-color: #ff6600;
        }
        .content-area {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .tool-detail-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .tool-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .download-btn {
            background-color: #ff6600;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .download-btn:hover {
            opacity: 0.9;
        }
        .tool-meta-info {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tool-meta-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .section-title {
            font-size: 16px;
            color: #ff6600;
            margin-bottom: 8px;
            font-weight: 600;
            border-right: 3px solid #ff6600;
            padding-right: 8px;
        }
        html[dir="ltr"] .section-title {
            border-right: none;
            border-left: 3px solid #ff6600;
            padding-right: 0;
            padding-left: 8px;
        }
        .tool-info-section p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
        }
        .tech-specs-box {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }
        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .spec-label {
            font-size: 12px;
            color: var(--text-muted);
        }
        .spec-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 2px solid var(--border-color);
            background-color: var(--footer-bg);
        }
        footer a {
            color: #ff6600;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .tech-specs-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function getQueryParams() {
            const params = {};
            window.location.search.substring(1).split('&').forEach(param => {
                const pair = param.split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            });
            return params;
        }

        let currentLang = localStorage.getItem('obsidian_lang') || 'ar';
        const params = getQueryParams();
        if (params.lang && toolsData[params.lang]) {
            currentLang = params.lang;
        }

        function initDetailsPage() {
            document.getElementById('langSelect').value = currentLang;
            applyLanguage(currentLang);
            renderToolDetails();
        }

        function changeLanguageDropdown(lang) {
            currentLang = lang;
            localStorage.setItem('obsidian_lang', currentLang);
            applyLanguage(currentLang);
            renderToolDetails();
        }

        function applyLanguage(lang) {
            const t = toolsData[lang] || toolsData['ar'];
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'en' || lang === 'fr' ? 'ltr' : 'rtl');
            document.getElementById('homeBtn').innerText = t.home;
            document.getElementById('footerText').innerHTML = t.footer;
            document.getElementById('reportLink').innerText = t.report;
        }

        function renderToolDetails() {
            const t = toolsData[currentLang] || toolsData['ar'];
            const toolId = params.tool;
            const container = document.getElementById('toolCardContainer');

            const tool = t.list.find(item => item.id === toolId);

            if (!tool) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 40px;">${t.notFound}</p>`;
                return;
            }

            document.getElementById('pageTitle').innerText = `Obsidian Tools - ${tool.name}`;

            container.innerHTML = `
                <div class="tool-header-top">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div style="font-size: 28px; color: #ff6600; background: var(--input-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--input-border);">
                            <i class="fa-solid fa-box-archive"></i>
                        </div>
                        <div>
                            <h1 style="font-size: 24px; color: var(--text-main); margin-bottom: 4px;">${tool.name}</h1>
                            <div class="tool-meta-info">
                                <span><i class="fa-solid fa-star" style="color: #f59e0b;"></i> ${tool.rating}</span>
                                <span><i class="fa-solid fa-tag"></i> ${tool.category}</span>
                                <span><i class="fa-solid fa-hard-drive"></i> ${tool.size}</span>
                            </div>
                        </div>
                    </div>
                    <a href="${tool.url}" class="download-btn" target="_blank" rel="noopener noreferrer">
                        <i class="fa-solid fa-download"></i> ${t.downloadBtn}
                    </a>
                </div>

                <div class="tool-info-section">
                    <h3 class="section-title">${t.descTitle}</h3>
                    <p>${tool.desc}</p>
                </div>

                <div class="tool-info-section">
                    <h3 class="section-title">${t.specsTitle}</h3>
                    <div class="tech-specs-box">
                        <div class="spec-item">
                            <span class="spec-label">${t.versionLabel}</span>
                            <span class="spec-value">${tool.version}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">${t.licenseLabel}</span>
                            <span class="spec-value">${tool.license}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">${t.platformLabel}</span>
                            <span class="spec-value">${tool.platform}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('obsidian_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
            initDetailsPage();
        });
    </script>
</body>
